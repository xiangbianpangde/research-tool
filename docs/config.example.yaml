# ============================================================
# 调研工具配置文件（示例）—— 复制为 config.yaml 后修改
# 依据：04-配置结构设计.md
# ============================================================

# LLM 配置（必填）。默认 DeepSeek（OpenAI 兼容）。
llm:
  provider: deepseek            # openai | deepseek | ollama | anthropic
  model: deepseek-chat          # 模型名
  api_key: ${DEEPSEEK_API_KEY}  # 支持 ${ENV_VAR} 环境变量引用
  base_url: https://api.deepseek.com/v1  # DeepSeek endpoint；OpenAI 留 null
  temperature: 0.3
  max_tokens: 4096
  connect_timeout_sec: 10       # TCP 建连硬超时
  read_timeout_sec: 120         # 单次网络读取超时（不采用 SDK 默认 600s）
  request_timeout_sec: 180      # 整个 chat/stream 调用硬墙
  sdk_max_retries: 0            # 禁 SDK 隐式重试，统一交给 pipeline 有界重试

# Collector 配置
collector:
  search_engines:               # 可多选，全部可用源见下
    - web                        # web(=duckduckgo) | arxiv | tavily
    - openalex                   # openalex(2.5亿+全学术,含最新) | crossref(1.5亿DOI)
    # 其它可选： semantic_scholar | wikipedia(百科/人物) | github(代码)
    #            pubmed(生物医学) | google_news(最新新闻) | bilibili(视频)
    #            cvpr(CVPR 论文，DBLP venue:CVPR，配 from_year/to_year)
    #            youtube(YouTube 视频发现，yt-dlp ytsearch，无需 API key)
    #            x / twitter(X 平台公开推文，默认通过 OpenCLI 复用浏览器登录态)
    #            opencli(浏览器兜底，默认 google-scholar adapter；需 Chrome Bridge)
    # 论文优先推荐 openalex：覆盖最全、限流最宽、自动混合"经典+最新"
  max_results_per_engine: 8
  depth: 2                       # 正式主链仅允许2=打开结果页 / 3=追踪二级链接
  language: both                 # zh | en | both
  concurrency: 4                 # 抓取层并发
  max_concurrent_searches: 3     # 搜索层并发上限（缓解 DDG/Tavily 限流）
  timeout_sec: 30
  # 保存原始资料：HTML/PDF 原始字节落盘 raw/_originals/（含 index.jsonl）供重新解析
  save_originals: true
  # arXiv 论文抓全文：abs/pdf 页优先 arXiv HTML5 全文；无 HTML 版回退摘要页+存 PDF 字节
  arxiv_fulltext: true
  proxy: ${HTTPS_PROXY}            # 抓取/搜索代理（collector.proxy → set_default_proxy / Fetcher）
                                   # 【地理与直连】
                                   # - 日本/海外等可直连 DDG/Wikipedia/GoogleNews 的环境：
                                   #   请在 .env 把 HTTPS_PROXY 留空（HTTPS_PROXY=）或删除该行，
                                   #   且 config 此处可写 proxy: null。未启动的本地代理
                                   #   （如 127.0.0.1:10809）会让 web 源与部分抓取 ConnectError（P1/P12）。
                                   # - 国内访问 DDG/Wikipedia/GoogleNews/Tavily 等被墙站点：
                                   #   在 .env 设 HTTPS_PROXY=http://127.0.0.1:<本地端口>
                                   #   （或 socks5://...），并保证代理进程已监听。
                                   # - openalex / crossref / arxiv / pubmed / bilibili / cvpr(DBLP)
                                   #   多数可直连，不依赖代理；youtube/yt-dlp 默认不走 env 代理
                                   #   （需代理时设 YTDLP_PROXY）。
                                   # 支持 http:// https:// socks5://
  tavily_api_key: ${TAVILY_API_KEY}            # 仅含 tavily 时需要
  semantic_scholar_api_key: ${S2_API_KEY}      # 可选，提升 S2 配额（无 key 也能用）
  github_token: ${GITHUB_TOKEN}                # 强烈建议；交互部署见 scripts/setup_interactive.py
                                   # Classic PAT：可不勾任何 scope（公开搜索+配额+code search）
                                   # 仅私有仓才勾 repo；禁止 admin/workflow/delete
  github_code_search: true

  openalex_mailto: ${OPENALEX_MAILTO}          # 可选邮箱，OpenAlex/Crossref polite pool 更稳
  # X/Twitter 渠道：默认 OpenCLI；需浏览器安装 opencli extension 并登录 x.com。
  # 若改用 twitter-cli，可设 x_backend: twitter-cli，并按需改 x_cmd。
  # twitter-cli 会读取 TWITTER_AUTH_TOKEN / TWITTER_CT0，或从浏览器自动提取。
  # 不要把 X cookie 写入配置文件或提交到远程仓库。
  x_backend: opencli              # opencli | twitter-cli
  x_cmd: twitter                  # twitter-cli 命令名或绝对路径
  x_min_engagement: 0             # X 最少互动(likes+rts+replies)；0=不过滤；字段缺失时跳过门槛
  opencli_cmd: opencli             # `-s opencli` 使用的本地命令
  opencli_site: google-scholar     # OpenCLI 中支持 search 的站点 adapter
  # X 使用前：opencli doctor 或 twitter status；-s x 会 preflight，失败给出安装说明
  # 两阶段锚定/去锚（P1，解决"被单一机构/限定语绑架"的查询偏差）
  core_keyword: null             # 核心词，如 topic="中南民族大学 康怡琳" 时填 "康怡琳"
  facets: []                     # 维度标签，仅去锚阶段生效，如 [博士, 论文, 南洋理工]
  # 时间标签（P2）：发表年份窗口，含起止。学科调研统一过滤；人物调研一般不设
  from_year: null                # 如 2020；openalex/s2/crossref/pubmed 原生过滤
  to_year: null                  # 如 2027；arxiv 客户端过滤，web/wikipedia 忽略
  # Deep-Search 深搜（P2）：多排序×多页，突破"单次只取第1页相关性排序"的覆盖不足
  deep_search: false             # true 启用；每查询变 deep_pages×deep_sorts 次搜索
  deep_pages: 3                  # 翻页页数 1-10
  deep_sorts: [relevance, date, citations]  # 排序策略组合
  # 专家库 / 额外 URL（ExpertLib）：让高质量但会被默认排序埋没的内容保证纳入
  extra_urls: []                 # 已知确切 URL 直塞抓取队列、跳过搜索，如某 repo/paper
  # 新论文专用：先逐个强制抓取官方源；全部成功后才自动补齐并运行
  # OpenAlex + Crossref + arXiv 扩展。任何官方源失败都会立即停止 collect。
  official_urls: []              # 作者/实验室/项目页/论文官方全文 URL
  experts_file: null             # experts.yaml 路径；缺失/损坏按空库回退，不崩管道
  expert_match_min_overlap: 0.15 # topic 与专家 domains 的词重叠阈值（占 topic 词数比例）
  expert_exempt_topn: true
  expert_scoped_github: true      # 专家弱档：org:<handle> topic 定向 github 搜索       # 专家命中豁免 top-N 截断（强档直注已置顶，恒生效）
  # 原 Deepen 策略属于 collect 内部，不增加阶段
  strategies:
    enabled: true
    entity_split: true
    max_entities: 5
    profile_extract: true
    profile_iterations: 1
    timeline_backtrack: true
    disambiguation: true
    gap_detection: true
    contradiction_check: true
    depth: 2
    breadth: 4


# Talk 关联（CVPRTalk）：按论文标题搜索 YouTube talk
# CLI：research run "..." -s cvpr --with-talks --max-talks 5
talk:
  enabled: false                 # true 或 --with-talks
  max_talks: 5                   # 硬上限（防 whisper 成本爆炸）
  min_title_similarity: 0.7      # 标题 Jaccard 置信闸，宁漏不误
  prefer_official_channel: true  # 排序优先 CVF/官方频道
  ingest: false                  # true 或 --ingest-talks：全量 VideoIngest；默认只写 discovery 笔记
  conference: CVPR
  search_results_per_paper: 5

# Cleaner 配置
cleaner:
  strip_html: true
  strip_nav: true
  strip_ads: true
  find_content_start: true
  min_content_length: 200
  max_content_length: 50000
  # MinHash 去重（P2-5）：相似度阈值，组内保留最长正文；0=关闭
  dedup_similarity: 0.85
  # LLM 相关性过滤（P2-5）：默认关，开启会增加 LLM 调用
  relevance_filter: false        # true 启用；低分文件从 clean/ 删除，raw/ 仍保留
  relevance_threshold: 0.4
  relevance_batch_size: 10

# Extractor 配置
extractor:
  enabled: true                  # 九段主链固定启用，不支持关闭 extract
  fail_on_chunk_error: true      # 失败块不写完成产物，由 pipeline 有界重试
  concurrency: 4                 # LLM 并行块数（实测 4 并发无限流；1=串行最稳）
  tasks:
    - ner
    - triple
  entity_types: null             # null=自动归纳 Schema
  relation_types: null
  chunk_size: 4000
  overlap: 200

# Knowledge / Inspect 配置（沿用 organizer 段名）
organizer:
  max_nodes: 7
  min_nodes: 4
  # 知识节点的最少证据数；不足时由 inspect 识别缺口
  min_evidence_per_node: 3

# Reporter 配置
reporter:
  format: markdown               # markdown | html
  style: report                  # report | feasibility | review | article
  max_length: 20000

# Pipeline 配置：阶段固定为完整九段，不支持跳过或重排
pipeline:
  mode: full                      # full | standard | deep，均使用同一九段主链
  work_dir: ./research-output
  stages:
    - collect
    - clean
    - extract
    - knowledge
    - inspect
    - targeted
    - merge
    - qgate
    - report
  resume: true                    # 性能基准应设 false，并使用独立输出目录
  llm_stage_attempts: 3           # 瞬时 LLM 失败的阶段级尝试次数（鉴权错误不重试）
  llm_retry_backoff_sec: 2        # 线性退避基数：2s、4s……

# 九段闭环边界：qgate 判定 CONTINUE 时执行 targeted → merge → inspect
nine_loop:
  max_rounds: 2                  # 最多补搜轮数；0=仅评估初次采集，不绕过质量门控
  max_high_findings: 0           # STOP_SUCCESS 允许的 high findings 上限
  max_total_findings: 0          # STOP_SUCCESS 允许的总 findings 上限
  wall_s_max: 1800               # 整条九段主链的墙钟时间上限（秒）
