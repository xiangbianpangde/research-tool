[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-tool"
version = "0.1.1"
description = "一个 Python 核心引擎 + 多接口层的调研工具：给定主题 → 产出知识树/报告"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pypinyin>=0.51",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# 重量级抓取：Crawl4AI（按架构设计 07）。安装后需执行 `crawl4ai-setup` 装浏览器。
crawl = ["crawl4ai>=0.4"]
# 搜索后端
search = ["ddgs>=6.0", "tavily-python>=0.5"]
# PDF 摄取（pdf2zh / MinerU 集成）—— 重依赖（~7GB 含模型）
pdf = ["mineru>=2.0"]
# 可视化 Web 界面
ui = ["gradio>=4.0"]
# VideoIngest V1.1 视频摄取（按 NFR1 隔离：yt-dlp / faster-whisper 均为重依赖）
# 注：NFR1 要求 yt-dlp 与 faster-whisper 放在 optional，避免污染核心 dependencies；
#     实际启用需 `pip install research-tool[video]`。
video = ["yt-dlp>=2024.5", "faster-whisper>=1.0"]
# 全部
all = [
    "crawl4ai>=0.4",
    "ddgs>=6.0",
    "tavily-python>=0.5",
    "yt-dlp>=2024.5",
    "faster-whisper>=1.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
research = "research_tool.presentation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["research_tool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["research_tool/tests"]
# addopts = "--cov=research_tool --cov-report=term-missing"  # 需 pip install pytest-cov

[tool.coverage.run]
source = ["research_tool"]
omit = ["research_tool/tests/*", "research_tool/__pycache__/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

# -- ruff: lint + format（02-代码规范 §二 落地配置） --
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]  # historical M-001..M-012 skeletons are design artifacts, not linted code

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "N",        # pep8-naming
    "T20",      # flake8-print (禁止 print)
    "T100",     # flake8-debugger (禁止调试断点)
    "S",        # flake8-bandit (安全)
    "PLR0915",  # pylint too-many-statements
]
ignore = [
    "S101",    # assert（测试中常用）
    "S301",    # pickle（Pydantic 不用）
    "S403",    # pickle
]
[tool.ruff.lint.per-file-ignores]
"research_tool/tests/*" = ["S101", "T20", "S108", "N814", "E501"]
"scripts/*" = ["T20"]

[tool.ruff.lint.pylint]
max-statements = 50
